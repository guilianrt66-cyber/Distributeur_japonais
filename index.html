<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>深夜の自販機</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DotGothic16&family=Zen+Maru+Gothic:wght@400;700&display=swap" rel="stylesheet">
<style>
  :root { --paper: #f3ecdc; --ink: #1b1b22; --neon-blue: #6fd3ff; }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  [hidden] { display: none !important; }
  html, body { margin: 0; height: 100%; background: #07080d; overflow: hidden; }
  body { font-family: "Zen Maru Gothic", system-ui, sans-serif; color: #e8ecf5; }
  button { font-family: inherit; }

  /* ---------- Écran d'entrée ---------- */
  #intro {
    position: fixed; inset: 0; z-index: 80; display: flex; flex-direction: column; align-items: center; justify-content: center;
    background: radial-gradient(ellipse at 50% 60%, rgba(20, 30, 60, .55), rgba(3, 4, 8, .92)); text-align: center; padding: 20px;
    transition: opacity .9s;
  }
  #intro.gone { opacity: 0; pointer-events: none; }
  .intro-jp { font-size: clamp(30px, 8vw, 56px); font-weight: 700; letter-spacing: 6px; color: #fff; text-shadow: 0 0 18px #ff4f8a, 0 0 40px rgba(255, 79, 138, .6); animation: neonflick 6s infinite; }
  .intro-fr { margin-top: 8px; font-size: 15px; opacity: .8; }
  .intro-sub { margin-top: 18px; font-size: 14px; opacity: .65; max-width: 420px; line-height: 1.6; }
  .enter { margin-top: 30px; background: none; color: #fff; border: 1px solid var(--neon-blue); padding: 11px 26px; border-radius: 30px; font-size: 16px; cursor: pointer; box-shadow: 0 0 18px rgba(111, 211, 255, .35); }
  .enter:hover { background: rgba(111, 211, 255, .12); }
  .intro-note { margin-top: 14px; font-size: 12px; opacity: .45; }

  /* ---------- La rue ---------- */
  #scene-wrap { position: fixed; inset: 0; transition: transform 1.3s cubic-bezier(.65, 0, .3, 1), filter 1s; will-change: transform; }
  #scene { width: 100%; height: 100%; display: block; }
  #scene-machine, #cat { cursor: pointer; }
  #machine-halo { animation: halo 2.6s ease-in-out infinite; }
  @keyframes halo { 50% { opacity: .55; } }
  .neon-flicker { animation: neonflick 5s infinite; }
  @keyframes neonflick { 0%,100%{opacity:1} 41%{opacity:1} 42%{opacity:.25} 43%{opacity:1} 44%{opacity:.4} 46%{opacity:1} }
  .blink-eyes { animation: eyes 5s infinite; transform-origin: center; transform-box: fill-box; }
  @keyframes eyes { 0%,92%,100% { transform: scaleY(1); } 95% { transform: scaleY(.1); } }
  #rain { position: fixed; inset: 0; pointer-events: none; z-index: 3; }
  #fade { position: fixed; inset: 0; background: #05060a; opacity: 0; pointer-events: none; z-index: 4; transition: opacity .5s; }
  .meow { position: fixed; z-index: 7; background: #fff; color: #111; padding: 4px 10px; border-radius: 12px; font-size: 14px; font-weight: 700; pointer-events: none; animation: meow 1.4s ease-out forwards; }
  @keyframes meow { 0% { opacity: 0; transform: translate(-50%, 0); } 15% { opacity: 1; } 100% { opacity: 0; transform: translate(-50%, -40px); } }

  .street-ui { position: fixed; inset: 0; pointer-events: none; z-index: 5; transition: opacity .4s; }
  .street-ui.hidden { opacity: 0; }
  .clock { position: absolute; top: 14px; left: 16px; text-shadow: 0 0 10px rgba(0,0,0,.9); }
  .clock-time { font-family: "DotGothic16", monospace; font-size: 32px; letter-spacing: 2px; display: block; }
  .clock-sub { font-size: 13px; opacity: .85; }
  .street-hint {
    position: absolute; left: 50%; bottom: 28px; transform: translateX(-50%);
    background: rgba(5, 6, 12, .7); border: 1px solid rgba(111, 211, 255, .35);
    padding: 9px 16px; border-radius: 20px; font-size: 14px; white-space: nowrap; animation: bob 2.4s ease-in-out infinite;
  }
  body.testing .street-hint { bottom: 80px; }
  @keyframes bob { 50% { transform: translate(-50%, -5px); } }

  .topbtns { position: fixed; top: 12px; right: 12px; z-index: 30; display: flex; gap: 8px; }
  .pill { background: rgba(5, 6, 12, .72); color: #fff; border: 1px solid rgba(255,255,255,.3); border-radius: 20px; padding: 6px 12px; font-size: 13px; cursor: pointer; }
  .pill b { color: var(--neon-blue); }

  /* ---------- Vue rapprochée ---------- */
  #closeup {
    position: fixed; inset: 0; z-index: 6; overflow-y: auto; display: none; opacity: 0; transition: opacity .6s;
    background: radial-gradient(ellipse 60% 70% at 40% 50%, rgba(0,0,0,0), rgba(0,0,0,.55));
  }
  #closeup.show { opacity: 1; }
  .closeup-inner { min-height: 100%; display: flex; gap: 32px; align-items: center; justify-content: center; padding: 60px 14px 40px; }
  body.testing .closeup-inner { padding-bottom: 90px; }
  .back { position: fixed; top: 12px; left: 12px; z-index: 30; }
  .vm-holder { position: relative; flex-shrink: 0; }

  .vm {
    width: 470px; position: absolute; top: 0; left: 0; transform-origin: top left; user-select: none;
    background: linear-gradient(90deg, #c4c9d1 0%, #f4f5f8 7%, #eceef2 60%, #d5d9e0 93%, #b9bec7 100%);
    border-radius: 10px 10px 4px 4px; padding: 10px 10px 14px;
    box-shadow: 0 0 90px rgba(140, 210, 255, .45), 0 30px 50px rgba(0,0,0,.7);
  }
  .vm-inner.shake { animation: shake .35s; }
  .vm.broken .glass { filter: brightness(.45) saturate(.5); }
  .vm.broken .tube { animation: tubeflick .6s infinite; }
  @keyframes shake { 0%,100% { transform: translateX(0) rotate(0); } 20% { transform: translateX(-7px) rotate(-1deg); } 40% { transform: translateX(6px) rotate(1deg); } 60% { transform: translateX(-4px); } 80% { transform: translateX(3px); } }

  .vm-head { border-radius: 6px; padding: 9px 12px; display: flex; gap: 8px; justify-content: space-between; align-items: center; background: linear-gradient(180deg, #e0213f, #a90d26); color: #fff; box-shadow: 0 0 18px rgba(255,50,80,.55), inset 0 0 12px rgba(255,255,255,.25); }
  .vm-logo { font-weight: 700; font-size: 17px; letter-spacing: 1px; }
  .vm-brand { flex-shrink: 0; font-family: "DotGothic16", monospace; font-size: 12px; background: #fff; color: #c8102e; padding: 2px 7px; border-radius: 3px; }
  .bezel { margin-top: 10px; background: #10141c; border-radius: 6px; padding: 6px; box-shadow: inset 0 0 0 2px #2a303c; }
  .glass { position: relative; overflow: hidden; border-radius: 3px; background: linear-gradient(180deg, #f2faff 0%, #d6ecfb 100%); padding: 12px 6px 4px; transition: filter .3s; }
  .tube { position: absolute; top: 3px; left: 8px; right: 8px; height: 4px; border-radius: 3px; z-index: 2; background: #fff; box-shadow: 0 0 10px #fff, 0 0 26px rgba(170,225,255,.9); animation: tubeflick 7s infinite; }
  @keyframes tubeflick { 0%,100%{opacity:1} 63%{opacity:1} 64%{opacity:.3} 65%{opacity:1} 66%{opacity:.5} 67%{opacity:1} }
  .glass::after { content: ""; position: absolute; inset: 0; pointer-events: none; z-index: 3; background: linear-gradient(115deg, transparent 30%, rgba(255,255,255,.28) 38%, transparent 46%, transparent 62%, rgba(255,255,255,.14) 66%, transparent 70%); }
  .side-leds { position: absolute; top: 14px; bottom: 8px; width: 4px; display: flex; flex-direction: column; justify-content: space-around; z-index: 2; }
  .side-leds.l { left: 2px; } .side-leds.r { right: 2px; }
  .side-leds i { width: 4px; height: 4px; border-radius: 50%; animation: twinkle 2s infinite; }
  @keyframes twinkle { 0%,100%{opacity:.25} 50%{opacity:1} }

  .shelf { margin-bottom: 6px; }
  .products { display: grid; grid-template-columns: repeat(6, 1fr); align-items: end; height: 74px; padding: 0 2px; }
  .product { display: flex; justify-content: center; align-items: flex-end; cursor: pointer; transition: filter .3s, opacity .3s, transform .2s; }
  .product:hover { transform: translateY(-2px); }
  .product svg { filter: drop-shadow(0 3px 2px rgba(0,0,0,.25)); }
  .slot-locked .product { filter: brightness(.6) saturate(.55); }
  .slot-opened .product { opacity: .18; }
  .ledge { height: 5px; background: linear-gradient(#b5bfcc, #8792a3); border-radius: 1px; }
  .ledstrip { height: 2px; margin: 0 4px; background: #bfeaff; box-shadow: 0 0 8px #8fdcff, 0 0 2px #fff; }
  .tags { display: grid; grid-template-columns: repeat(6, 1fr); gap: 3px; padding: 4px 1px 2px; }
  .tag { width: 100%; background: #fff; border-radius: 3px; text-align: center; padding: 2px 1px 3px; cursor: pointer; box-shadow: 0 1px 0 #9aa5b5; border: none; display: flex; flex-direction: column; align-items: center; gap: 1px; }
  .tag .num { font-family: "DotGothic16", monospace; font-size: 17px; color: #1b1b22; line-height: 1.1; }
  .tag .state { font-size: 10px; font-weight: 700; line-height: 1.15; white-space: nowrap; color: #6b7384; }
  .tag .led { width: 10px; height: 10px; border-radius: 50%; background: #3b2228; margin-top: 1px; box-shadow: inset 0 1px 1px rgba(0,0,0,.5); }
  .slot-available .tag .led { background: #ff2d4b; box-shadow: 0 0 6px #ff2d4b, 0 0 12px rgba(255,45,75,.7); animation: blink 1s steps(2) infinite; }
  .slot-available .tag .state { color: #d6203f; }
  .slot-opened .tag .state { color: #fff; background: #d6203f; padding: 0 3px; border-radius: 2px; box-shadow: 0 0 6px rgba(255,45,75,.6); }
  .slot-opened .tag .led { background: #612; }
  @keyframes blink { 50% { opacity: .25; } }

  .vm-panel { display: flex; gap: 8px; margin-top: 10px; align-items: stretch; }
  .lcd { flex: 1; background: #0b1710; border-radius: 4px; padding: 7px 9px; min-height: 38px; font-family: "DotGothic16", monospace; color: #7dff9b; font-size: 15px; text-shadow: 0 0 6px rgba(125,255,155,.75); box-shadow: inset 0 0 10px #000; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; display: flex; align-items: center; }
  .coin { width: 38px; background: #2b2f3a; border-radius: 4px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; }
  .coin i { display: block; width: 3px; height: 16px; background: #000; border-radius: 2px; box-shadow: 0 0 0 2px #555c6b; }
  .coin b { width: 6px; height: 6px; border-radius: 50%; background: #ffcf3a; box-shadow: 0 0 6px #ffcf3a; animation: blink 1.6s steps(2) infinite; }
  .flap { margin-top: 10px; height: 68px; border-radius: 6px; position: relative; overflow: hidden; cursor: pointer; width: 100%; border: none; background: linear-gradient(180deg, #0e1016, #2a2f3b); box-shadow: inset 0 10px 14px rgba(0,0,0,.85), 0 0 0 3px #b8bec8; }
  .flap-label { position: absolute; top: 5px; left: 9px; font-size: 11px; color: #9aa3b5; }
  .flap.ready { box-shadow: inset 0 10px 14px rgba(0,0,0,.85), 0 0 0 3px #ffd76a, 0 0 18px rgba(255,215,106,.7); }
  .flap .take { position: absolute; right: 10px; top: 5px; font-size: 12px; color: #ffd76a; display: none; animation: blink 1.2s infinite; }
  .flap.ready .take { display: block; }
  .falling { position: absolute; left: 50%; bottom: 6px; animation: drop .55s cubic-bezier(.5,0,.75,0) both, land .3s .55s ease-out; }
  @keyframes drop { from { transform: translate(-50%, -110px) rotate(-60deg); } to { transform: translate(-50%, 0) rotate(-90deg); } }
  @keyframes land { 50% { transform: translate(-50%, -6px) rotate(-90deg); } to { transform: translate(-50%, 0) rotate(-90deg); } }
  .falling svg { display: block; }

  /* Panneau « collection » */
  .panel { width: 310px; max-width: 94vw; background: rgba(9, 11, 19, .78); border: 1px solid rgba(111,211,255,.22); border-radius: 14px; padding: 16px; backdrop-filter: blur(6px); align-self: center; }
  .panel h3 { margin: 0 0 4px; font-size: 16px; display: flex; justify-content: space-between; align-items: baseline; }
  .panel h3 span { font-family: "DotGothic16", monospace; color: var(--neon-blue); font-size: 14px; }
  .panel .time-label { font-size: 12px; opacity: .65; margin-bottom: 12px; }
  .collection { display: flex; flex-direction: column; gap: 6px; max-height: 46vh; overflow-y: auto; padding-right: 4px; }
  .coll-item { display: flex; gap: 10px; align-items: center; background: rgba(255,255,255,.04); border: 1px solid rgba(255,255,255,.07); border-radius: 8px; padding: 6px 8px; cursor: pointer; text-align: left; color: inherit; width: 100%; }
  .coll-item:hover { background: rgba(111,211,255,.1); }
  .coll-item svg { flex-shrink: 0; }
  .coll-item .ci-day { font-family: "DotGothic16", monospace; font-size: 11px; color: var(--neon-blue); }
  .coll-item .ci-title { font-size: 13px; font-weight: 700; line-height: 1.25; }
  .coll-item .ci-artist { font-size: 11px; opacity: .6; }
  .coll-empty { font-size: 13px; opacity: .6; line-height: 1.5; }
  .fragments { display: flex; gap: 6px; margin-top: 14px; align-items: center; flex-wrap: wrap; }
  .fragments-label { font-size: 12px; opacity: .8; width: 100%; }
  .frag { flex: 1; min-width: 50px; height: 30px; padding: 0 6px; border-radius: 4px; border: 1px dashed rgba(255,255,255,.35); display: flex; align-items: center; justify-content: center; font-family: "DotGothic16", monospace; font-size: 13px; color: rgba(255,255,255,.4); }
  .frag.got { background: var(--paper); color: var(--ink); border: 1px solid var(--paper); transform: rotate(-2deg); }
  .hint { font-size: 13px; opacity: .85; margin: 14px 0 0; min-height: 18px; line-height: 1.5; }

  @media (max-width: 899px) {
    .closeup-inner { flex-direction: column; justify-content: flex-start; gap: 18px; }
  }

  /* ---------- Fenêtre de la boisson ---------- */
  .modal-bg { position: fixed; inset: 0; z-index: 60; background: rgba(4,5,12,.8); display: flex; align-items: flex-start; justify-content: center; overflow-y: auto; padding: 24px 12px; backdrop-filter: blur(3px); }
  .card { width: min(100%, 780px); background: #12141d; border-radius: 14px; padding: 18px; border: 1px solid rgba(111,211,255,.25); box-shadow: 0 0 40px rgba(111,211,255,.15); position: relative; animation: rise .35s ease-out; }
  @keyframes rise { from { transform: translateY(20px); opacity: 0; } }
  .close { position: absolute; top: 10px; right: 12px; background: none; border: none; color: #aab; font-size: 26px; cursor: pointer; line-height: 1; }
  .card-head { font-family: "DotGothic16", monospace; font-size: 13px; color: var(--neon-blue); display: flex; gap: 10px; }
  .chip { display: inline-block; margin-top: 10px; font-size: 11px; padding: 3px 9px; border-radius: 20px; background: rgba(255,79,109,.15); color: #ff8aa0; border: 1px solid rgba(255,79,109,.4); }
  .card h2 { margin: 10px 0 0; font-size: 22px; line-height: 1.3; }
  .romaji { margin: 2px 0 0; color: #b9a6ff; font-size: 14px; }
  .artist { margin: 4px 0 12px; color: #9aa3b5; }
  .tabs { display: flex; gap: 6px; margin-bottom: 8px; flex-wrap: wrap; }
  .tab { border: 1px solid rgba(255,255,255,.2); background: none; color: #ccd; padding: 5px 12px; border-radius: 20px; cursor: pointer; font-size: 13px; }
  .tab.active { background: var(--neon-blue); color: #0b1020; border-color: var(--neon-blue); }
  .player { aspect-ratio: 16/9; background: #000; border-radius: 8px; overflow: hidden; }
  .player iframe { width: 100%; height: 100%; border: 0; display: block; }
  .player .missing { height: 100%; display: flex; align-items: center; justify-content: center; color: #667; font-size: 13px; padding: 10px; text-align: center; }
  .yt-link { margin-top: 6px; font-size: 12px; text-align: right; }
  .yt-link a { color: #8fa3c0; }
  .info { line-height: 1.6; font-size: 15px; margin: 14px 0 0; color: #d6dbe6; }
  .mot { margin-top: 14px; padding: 12px 14px; background: var(--paper); color: var(--ink); border-radius: 4px; transform: rotate(-.6deg); line-height: 1.6; font-size: 15px; white-space: pre-line; }
  .bonus { margin-top: 18px; }
  .bonus-btn { width: 100%; padding: 12px; border-radius: 10px; border: 1px dashed #ffd76a; background: rgba(255,215,106,.08); color: #ffd76a; font-size: 14px; cursor: pointer; }
  .bonus-card { margin-top: 12px; animation: rise .35s ease-out; }
  .paper { background: var(--paper); color: var(--ink); padding: 14px; border-radius: 4px; line-height: 1.6; white-space: pre-line; transform: rotate(.8deg); }
  .ticket { background: #ffd76a; color: #2a1d00; padding: 14px 16px; border-radius: 6px; border-left: 4px dashed #2a1d00; font-weight: 700; line-height: 1.5; }
  .ticket small { display: block; font-weight: 400; margin-top: 6px; }
  .objet { text-align: center; line-height: 1.6; }
  .objet .emoji { font-size: 56px; display: block; }
  .frag-big { display: inline-block; background: var(--paper); color: var(--ink); font-family: "DotGothic16", monospace; font-size: 26px; padding: 6px 16px; transform: rotate(-3deg); margin: 8px 0; }
  .final-pass { font-family: "DotGothic16", monospace; font-size: 30px; letter-spacing: 4px; text-align: center; color: #ffd76a; text-shadow: 0 0 12px rgba(255,215,106,.6); margin: 10px 0; }

  /* ---------- Barre de test ---------- */
  .testbar { position: fixed; left: 50%; bottom: 10px; transform: translateX(-50%); z-index: 70; background: #ffd76a; color: #2a1d00; border-radius: 30px; padding: 6px 8px; display: flex; gap: 6px; align-items: center; font-size: 13px; font-weight: 700; box-shadow: 0 4px 20px rgba(0,0,0,.6); white-space: nowrap; }
  .testbar button { border: none; background: #2a1d00; color: #ffd76a; border-radius: 20px; padding: 5px 10px; cursor: pointer; font-weight: 700; }
  .testbar .d { min-width: 64px; text-align: center; }

  /* ---------- Détails animés de la ruelle ---------- */
  .drift { animation: drift linear infinite; }
  @keyframes drift { from { transform: translateX(-700px); } to { transform: translateX(1900px); } }
  .plane { animation: plane 80s linear infinite; }
  @keyframes plane { from { transform: translate(-60px, 100px); } to { transform: translate(1680px, 30px); } }
  .blinkfast { animation: blink 1.1s steps(2) infinite; }
  .spin { animation: spin 3s linear infinite; transform-box: fill-box; transform-origin: center; }
  .spin.slow { animation-duration: 5s; }
  @keyframes spin { to { transform: rotate(360deg); } }
  .sway { animation: sway 5s ease-in-out infinite; transform-box: fill-box; transform-origin: top center; }
  @keyframes sway { 50% { transform: rotate(2.5deg); } }
  .steam circle { animation: steam 4s ease-out infinite; transform-box: fill-box; transform-origin: center; opacity: 0; }
  @keyframes steam { 0% { opacity: 0; transform: translateY(0) scale(.6); } 20% { opacity: .35; } 100% { opacity: 0; transform: translateY(-80px) scale(2); } }
  .orbit { animation: orbit 2.4s linear infinite; }
  @keyframes orbit { to { transform: rotate(360deg); } }
  .lampflick { animation: lampflick 9s infinite; }
  @keyframes lampflick { 0%,100%{opacity:1} 70%{opacity:1} 71%{opacity:.35} 72%{opacity:1} 73%{opacity:.6} 74%{opacity:1} }
  .tail2 { animation: tail2 4s ease-in-out infinite; transform-box: fill-box; transform-origin: 0% 0%; }
  @keyframes tail2 { 50% { transform: rotate(4deg); } }
  .tail { animation: tail 3s ease-in-out infinite; transform-box: fill-box; transform-origin: 0% 100%; }
  @keyframes tail { 50% { transform: rotate(-14deg); } }
  #neons > g { transition: filter .2s; }
  #neons > g:hover { filter: brightness(1.8) saturate(1.3); }
  #gacha, #msg-building { cursor: pointer; }
  #gacha:hover { filter: brightness(1.25); }
  #scene-machine:hover { filter: brightness(1.08); }
  .product:hover svg { filter: drop-shadow(0 0 6px rgba(255,255,255,.95)) brightness(1.12); }
  .tip { position: fixed; z-index: 65; pointer-events: none; background: rgba(8,10,18,.92); border: 1px solid rgba(111,211,255,.35); color: #e8ecf5; font-size: 12px; padding: 4px 9px; border-radius: 8px; white-space: nowrap; transform: translate(-50%, -140%); }
  .omikuji-bg { position: fixed; inset: 0; z-index: 62; background: rgba(4,5,12,.7); display: flex; align-items: center; justify-content: center; backdrop-filter: blur(2px); cursor: pointer; }
  .omikuji { width: 230px; background: #f7f1e3; color: #2a1d10; border-radius: 3px; padding: 18px 16px 20px; text-align: center; box-shadow: 0 10px 40px rgba(0,0,0,.6); animation: unroll .5s ease-out; border-top: 10px solid #b3202a; border-bottom: 10px solid #b3202a; transform-origin: top; }
  @keyframes unroll { from { transform: scaleY(.05); opacity: 0; } }
  .ok-title { font-size: 13px; letter-spacing: 4px; color: #b3202a; }
  .ok-kanji { font-size: 56px; font-weight: 700; margin: 6px 0 0; color: #b3202a; }
  .ok-read { font-size: 12px; opacity: .7; }
  .ok-text { margin-top: 12px; font-size: 14px; line-height: 1.55; }
  .ok-close { margin-top: 14px; font-size: 11px; opacity: .5; }

  @media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation: none !important; transition: none !important; } }
</style>
</head>
<body>

<!-- ======================= LA RUE ======================= -->
<div id="scene-wrap">
<svg id="scene" viewBox="0 0 1600 1000" preserveAspectRatio="xMidYMid slice" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1"><stop id="sky-top" offset="0" stop-color="#2b1b4a"/><stop id="sky-bot" offset="1" stop-color="#e0785a"/></linearGradient>
    <linearGradient id="wall" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#2e3038"/><stop offset=".6" stop-color="#24262d"/><stop offset="1" stop-color="#17181d"/></linearGradient>

/* ---------------- Le temps qui passe : 18h00 → 5h30 ---------------- */
function lerpTable(table, x) {
  let k = 0; while (k < table.length - 2 && x > table[k + 1][0]) k++;
  const a = table[k], b = table[k + 1], f = Math.max(0, Math.min(1, (x - a[0]) / (b[0] - a[0])));
  return a.slice(1).map((v, i) => typeof v === "number" ? v + (b[i + 1] - v) * f : mix(v, b[i + 1], f));
}
function mix(a, b, k) {
  const pa = [1, 3, 5].map(i => parseInt(a.substr(i, 2), 16)), pb = [1, 3, 5].map(i => parseInt(b.substr(i, 2), 16));
  return "#" + pa.map((v, i) => Math.round(v + (pb[i] - v) * k).toString(16).padStart(2, "0")).join("");
}

const TIME = [
  [0.00, "#3d3a8f", "#ff9a5c", "#ff8a40", .14, .85, 0],
  [0.13, "#25286e", "#d0607e", "#8a3a80", .12, .8, .2],

  [0.50, "#02030c", "#0b1130", "#000412", .40, .5, 1],
  [0.75, "#000005", "#05091c", "#000208", .50, .15, 1],
  [0.90, "#101a42", "#4a4a80", "#1a2450", .28, .22, .6],
  [1.00, "#5f86c4", "#ffbe8a", "#ffb08a", .16, .3, 0]
];
function applyTime(day) {
  const x = Math.max(0, Math.min(1, (day - 1) / 23));
  const [top, bot, veil, veilOp, winFrac, starOp] = lerpTable(TIME, x);
  $("sky-top").setAttribute("stop-color", top);
  $("sky-bot").setAttribute("stop-color", bot);
  $("ambient").setAttribute("fill", veil);
  $("ambient").setAttribute("opacity", veilOp.toFixed(3));
  $("stars").setAttribute("opacity", starOp.toFixed(2));
  $("sun-dusk").setAttribute("opacity", Math.max(0, 1 - x / .22).toFixed(2));
  $("sun-dawn").setAttribute("opacity", Math.max(0, (x - .84) / .16).toFixed(2));
  // la lune traverse le ciel
  const mx = (x - .1) / .8, moon = $("moon");
  if (mx > 0 && mx < 1) {
    moon.setAttribute("transform", `translate(${120 + mx * 1360} ${210 - Math.sin(Math.PI * mx) * 150})`);
    moon.setAttribute("opacity", Math.min(1, Math.sin(Math.PI * mx) * 2.5).toFixed(2));
  } else moon.setAttribute("opacity", 0);
  // les fenêtres s'éteignent au fil de la nuit
  WINDOWS.forEach(w => w.el.setAttribute("display", w.r < winFrac ? "inline" : "none"));
  // les néons ressortent quand il fait noir
  $("neons").setAttribute("opacity", (.65 + .35 * starOp).toFixed(2));
  curWinFrac = winFrac; updateMsgBuilding();
  snowing = day >= 24;
  $("snowcover").setAttribute("display", snowing ? "inline" : "none");
  $("snowfloor").setAttribute("display", snowing ? "inline" : "none");
  Sound.setRainFactor(snowing ? .15 : 1);
  Sound.setChristmas(snowing);
  $("cat-hat").setAttribute("display", snowing ? "inline" : "none");
}

const wrap = $("scene-wrap");

function approach() {
  if (inCloseup) return;
  inCloseup = true;
  Sound.beep();
  const r = $("scene-machine").getBoundingClientRect(), cx = r.left + r.width / 2, cy = r.top + r.height / 2;
  const s = Math.min(9, (innerHeight * .95) / r.height, (innerWidth * .95) / r.width);
  wrap.style.transformOrigin = `${cx}px ${cy}px`;
  wrap.style.transform = `translate(${innerWidth / 2 - cx}px, ${innerHeight / 2 - cy}px) scale(${s})`;
  $("street-ui").classList.add("hidden");
  setTimeout(() => { $("fade").style.opacity = 1; }, 850);
  setTimeout(() => {
    wrap.style.transform = `translate(${innerWidth / 2 - cx}px, ${innerHeight / 2 - cy}px) scale(${s * .55})`;
    wrap.style.transition = "none"; wrap.style.filter = "blur(9px) brightness(.5)";
    $("closeup").style.display = "block";
    fitMachine();
    requestAnimationFrame(() => { wrap.style.transition = ""; $("closeup").classList.add("show"); $("fade").style.opacity = 0; });
    Sound.setMode("machine");
  }, 1350);
}

  $("closeup").classList.remove("show");

}

  if (snowing) bubble(lang === "fr" ? "Joyeux Noël ✦ miaou" : "メリークリスマス ✦ にゃ", ...catSpot(), 2600);

addEventListener("mousemove", e => {
  if (inCloseup) return;
  const r = $("cat").getBoundingClientRect(), cx = r.left + r.width / 2, cy = r.top + r.height * .3;

addEventListener("resize", () => { if (!inCloseup) fitScene(); else fitMachine(); });

/* Le distributeur prend toute la place disponible */
function fitMachine() {
  const vm = $("vm"), holder = $("vm-holder"), H = vm.offsetHeight, wide = innerWidth >= 900;
  const availW = wide ? innerWidth - 310 - 32 - 60 : innerWidth - 24;
  const availH = innerHeight - (TEST ? 150 : 90);
  const s = wide ? Math.min(availW / 470, availH / H, 1.8) : Math.min(availW / 470, 1.4);
  vm.style.transform = `scale(${s})`;
  holder.style.width = 470 * s + "px"; holder.style.height = H * s + "px";
}

/* =====================================================================
   LE DISTRIBUTEUR
   ===================================================================== */
const vm = $("vm"), flap = $("flap"), lcd = $("lcd"), hint = $("hint");
let pendingDay = null, lcdKey = "welcome", lcdExtra = "";
function setLcd(key, extra = "") { lcdKey = key; lcdExtra = extra; lcd.textContent = (key ? t(key) : "") + extra; }

function buildLeds() {
  const colors = ["#ff2d4b", "#4fe0ff", "#7dff9b", "#ffd76a", "#ff4fa3"];
  ["leds-l", "leds-r"].forEach((id, side) => {
    const el = $(id); el.innerHTML = "";
    for (let i = 0; i < 9; i++) { const c = colors[(i + side * 2) % colors.length]; el.insertAdjacentHTML("beforeend", `<i style="background:${c};box-shadow:0 0 6px ${c};animation-delay:${-(i * .37 + side * .9)}s"></i>`); }
  });
}

function renderMachine() {
  const shelves = $("shelves"); shelves.innerHTML = "";
  for (let r = 0; r < 4; r++) {
    const shelf = document.createElement("div"); shelf.className = "shelf";
    let prods = "", tags = "";
    for (let c = 0; c < 6; c++) {
      const day = r * 6 + c + 1;
      const st = day > unlocked ? "locked" : state.opened.includes(day) ? "opened" : "available";
      const label = st === "locked" ? t("locked") : st === "opened" ? t("sold") : t("push");
      const tip = st === "locked" ? `Jour ${day} · le ${day} décembre` : st === "opened" ? `Jour ${day} · déjà bue` : `Jour ${day} · disponible !`;
      prods += `<div class="product slot-${st}" data-day="${day}" data-tip="${tip}">${drinkSVG(day - 1)}</div>`;
      tags += `<div class="slot-${st}"><button class="tag" data-day="${day}"><span class="num">${day}</span><span class="state">${label}</span><span class="led"></span></button></div>`;
    }
    shelf.innerHTML = `<div class="products">${prods}</div><div class="ledge"></div><div class="ledstrip"></div><div class="tags">${tags}</div>`;
    shelves.appendChild(shelf);
  }
  shelves.querySelectorAll("[data-day]").forEach(el => el.addEventListener("click", e => { e.stopPropagation(); press(+el.dataset.day); }));
  renderPanel();
}

$("shelves").addEventListener("mousemove", e => {
  const el = e.target.closest("[data-tip]"), tip = $("tip");
  if (!el) { tip.hidden = true; return; }
  tip.textContent = el.dataset.tip; tip.style.left = e.clientX + "px"; tip.style.top = e.clientY + "px"; tip.hidden = false;
});
$("shelves").addEventListener("mouseleave", () => { $("tip").hidden = true; });
function renderPanel() {
  const opened = [...state.opened].sort((a, b) => a - b);
  $("count").textContent = `${opened.length}/24`;
  $("time-label").textContent = unlocked ? `${timeOf(Math.max(1, unlocked))} · ${momentOf(Math.max(1, unlocked))}` : "La machine dort encore";
  const col = $("collection"); col.innerHTML = "";
  if (!opened.length) col.innerHTML = `<div class="coll-empty">Rien pour l'instant. Appuie sur un bouton qui clignote.</div>`;
  opened.forEach(day => {
    const d = DAYS[day - 1], b = document.createElement("button");
    b.className = "coll-item";
    b.innerHTML = `${drinkSVG(day - 1, .55)}<div><div class="ci-day">Jour ${day} · ${timeOf(day)}</div><div class="ci-title">${escapeHtml(d.title)}</div><div class="ci-artist">${escapeHtml(d.artist)}</div></div>`;
    b.onclick = () => openModal(day, false);
    col.appendChild(b);
  });
  const box = $("fragments"); box.innerHTML = `<span class="fragments-label">Fragments du code</span>`;
  FRAGMENTS.forEach((f, i) => {
    const day = DAYS.findIndex(d => d.bonus && d.bonus.type === "fragment" && d.bonus.index === i) + 1, got = state.opened.includes(day);
    box.insertAdjacentHTML("beforeend", `<div class="frag ${got ? "got" : ""}">${got ? escapeHtml(f) : "?"}</div>`);
  });
}

function press(day) {
  if (vm.classList.contains("broken")) return;
  Sound.beep();
  if (pendingDay) { hint.textContent = "Récupère d'abord ta boisson dans le bac."; return; }
  if (day > unlocked) { setLcd("locked", ` · ${day}`); hint.textContent = "Pas encore. La machine est patiente, toi aussi."; return; }
  if (state.opened.includes(day)) { openModal(day, false); return; }
  const d = DAYS[day - 1];
  if (d.bonus && d.bonus.type === "panne" && !state.repaired) { startBreakdown(day); return; }
  dropCan(day);
}

function startBreakdown(day) {
  vm.classList.add("broken"); setLcd("broken", " — HORS SERVICE");
  hint.textContent = "La machine est en panne. Tape dessus.";
  let taps = 0; const need = DAYS[day - 1].bonus.taps || 7;
  const lines = ["…", "Encore.", "Plus fort.", "Ça bouge…", "Presque.", "Allez."];
  const inner = $("vm-inner");
  const onTap = e => {
    e.stopPropagation(); taps++;
    inner.classList.remove("shake"); void inner.offsetWidth; inner.classList.add("shake");
    Sound.bang();
    hint.textContent = lines[Math.min(taps - 1, lines.length - 1)];
    if (taps >= need) {
      vm.removeEventListener("click", onTap, true);
      vm.classList.remove("broken"); state.repaired = true; save(STORE_KEY, state);
      hint.textContent = "Réparée à coups de poing. Méthode validée par tous les techniciens.";
      dropCan(day);
    }
  };
  vm.addEventListener("click", onTap, true);
}

function dropCan(day) {
  pendingDay = day; setLcd("clonk");
  flap.querySelectorAll(".falling").forEach(c => c.remove());
  const can = document.createElement("div"); can.className = "falling"; can.innerHTML = drinkSVG(day - 1, .9);
  flap.appendChild(can);
  setTimeout(() => { Sound.clank(); flap.classList.add("ready"); }, 520);
}

flap.addEventListener("click", () => {
  if (!pendingDay) return;
  const day = pendingDay; pendingDay = null;
  flap.classList.remove("ready"); flap.querySelectorAll(".falling").forEach(c => c.remove());
  if (!state.opened.includes(day)) { state.opened.push(day); save(STORE_KEY, state); }
  setLcd("thanks"); renderMachine();
  openModal(day, true);
});

/* =====================================================================
   FENÊTRE DE LA BOISSON
   ===================================================================== */
function youtubeId(url) { if (!url) return ""; const m = url.match(/(?:youtu\.be\/|v=|embed\/|shorts\/)([\w-]{11})/); return m ? m[1] : (/^[\w-]{11}$/.test(url) ? url : ""); }
function showVideo(v) {
  const id = youtubeId(v.url);
  if (id && location.protocol === "file:") {
    $("m-player").innerHTML = `<div class="missing">YouTube bloque les vidéos quand la page est ouverte en double-cliquant sur le fichier (adresse en file:///).<br>Ouvre-la avec Live Server (adresse en http://…) ou en ligne : ça marchera tout seul.</div>`;
    $("m-yt").innerHTML = `<a href="https://www.youtube.com/watch?v=${id}" target="_blank" rel="noopener">L'ouvrir sur YouTube ↗</a>`;
    return;
  }
  $("m-player").innerHTML = id ? `<iframe src="https://www.youtube-nocookie.com/embed/${id}" referrerpolicy="strict-origin-when-cross-origin" allow="autoplay; encrypted-media; picture-in-picture" allowfullscreen title="${escapeHtml(v.label)}"></iframe>` : `<div class="missing">Vidéo à venir (${escapeHtml(v.label)})</div>`;
  $("m-yt").innerHTML = id ? `<a href="https://www.youtube.com/watch?v=${id}" target="_blank" rel="noopener">La vidéo ne se lance pas ? L'ouvrir sur YouTube ↗</a>` : "";
}
let modalDay = null;
function openModal(day, fresh) {
  modalDay = day; const d = DAYS[day - 1];
  Sound.setMode("quiet");
  if (fresh) Sound.jingle();
  $("m-day").textContent = `Jour ${day} · ${day} décembre`; $("m-time").textContent = timeOf(day);
  $("m-tag").textContent = d.tag; $("m-title").textContent = d.title; fillRomaji();
  $("m-artist").textContent = d.artist; $("m-info").textContent = d.info;
  $("m-mot").hidden = !d.mot; $("m-mot").textContent = d.mot || "";
  const tabs = $("m-tabs"); tabs.innerHTML = "";
  if (d.videos.length > 1) d.videos.forEach((v, i) => {
    const b = document.createElement("button"); b.className = "tab" + (i === 0 ? " active" : ""); b.textContent = v.label;
    b.onclick = () => { tabs.querySelectorAll(".tab").forEach(x => x.classList.remove("active")); b.classList.add("active"); showVideo(v); };
    tabs.appendChild(b);
  });
  showVideo(d.videos[0]);
  const bonus = $("m-bonus"); bonus.innerHTML = "";
  if ((d.bonus && d.bonus.type !== "panne") || d.final) {
    const btn = document.createElement("button"); btn.className = "bonus-btn";
    btn.textContent = d.final ? "Il reste quelque chose au fond du bac…" : "Il y a autre chose dans le bac…";
    btn.onclick = () => {
      btn.remove(); bonus.appendChild(bonusCard(d));
      if (d.final) Sound.finale(); else if (d.bonus.type === "fragment") Sound.sparkle(); else Sound.jingle();
    };
    bonus.appendChild(btn);
  }
  $("modal").hidden = false;
}
function fillRomaji() {
  if (!modalDay) return; const d = DAYS[modalDay - 1], el = $("m-romaji");
  el.hidden = !d.romaji; el.textContent = d.romaji ? (lang === "fr" && d.fr ? `${d.romaji} · « ${d.fr} »` : d.romaji) : "";
}
function bonusCard(d) {
  const el = document.createElement("div"); el.className = "bonus-card";
  if (d.final) {
    el.innerHTML = `<div class="paper">${escapeHtml(FINAL_MSG)}</div><p style="text-align:center;margin:16px 0 0;opacity:.8">Les quatre fragments, remis dans l'ordre :</p><div class="final-pass">${FRAGMENTS.map(escapeHtml).join("")}</div><p style="text-align:center;opacity:.8;font-size:14px">Garde-le précieusement. Il te servira demain.</p>`;
    return el;
  }
  const b = d.bonus;
  if (b.type === "fragment") el.innerHTML = `<div class="objet">Un bout de papier est collé sous la boisson.<br><span class="frag-big">${escapeHtml(FRAGMENTS[b.index])}</span><br>Fragment ${b.index + 1}/4. Ne le perds pas.</div>`;
  else if (b.type === "mot") el.innerHTML = `<div class="paper">${escapeHtml(b.text)}</div>`;
  else if (b.type === "bon") el.innerHTML = `<div class="ticket">${escapeHtml(b.text)}<small>${escapeHtml(b.small || "")}</small></div>`;
  else if (b.type === "objet") el.innerHTML = `<div class="objet"><span class="emoji">${b.emoji}</span>${escapeHtml(b.text).replace(/\n/g, "<br>")}</div>`;
  return el;
}
function escapeHtml(s) { return String(s).replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c])); }
function closeModal() {
  $("modal").hidden = true; $("m-player").innerHTML = ""; modalDay = null;
  Sound.setMode(inCloseup ? "machine" : "street");
}
$("close").onclick = closeModal;
$("modal").addEventListener("click", e => { if (e.target.id === "modal") closeModal(); });
const KONAMI = ["ArrowUp", "ArrowUp", "ArrowDown", "ArrowDown", "ArrowLeft", "ArrowRight", "ArrowLeft", "ArrowRight", "b", "a"];
let kIdx = 0, keyBuf = "";
addEventListener("keydown", e => {
  if (!$("intro").hidden) { if (e.key === "Enter" || e.key === " ") { e.preventDefault(); $("enter").click(); } return; }
  const k = e.key.length === 1 ? e.key.toLowerCase() : e.key;
  kIdx = k === KONAMI[kIdx] ? kIdx + 1 : (k === KONAMI[0] ? 1 : 0);
  if (kIdx === KONAMI.length) { kIdx = 0; secret(); }
  if (e.key === "Escape") {
    if (!$("omikuji").hidden) $("omikuji").hidden = true;
    else if (!$("modal").hidden) closeModal();
    else if (inCloseup) leave();
    return;
  }
  if (!$("modal").hidden || !$("omikuji").hidden) return;
  if ((e.key === "Enter" || e.key === " ") && !inCloseup && e.target === document.body) { e.preventDefault(); approach(); return; }
  if (k === "s") $("mute").click();
  if (k === "l") $("lang").click();
  if (e.key.length === 1) {
    keyBuf = (keyBuf + k).slice(-12);
    if (keyBuf.endsWith("maggie")) { keyBuf = ""; maggie(); }
    else if (keyBuf.endsWith("nya")) { keyBuf = ""; Sound.meow(); bubble(t("meow"), ...catSpot()); }
  }
});

/* ---------------- Langue & son ---------------- */
function applyLang() {
  $("lang").innerHTML = t("btn");
  document.querySelectorAll("[data-t]").forEach(el => el.textContent = t(el.dataset.t));
  if (lcdKey) setLcd(lcdKey, lcdExtra);
  renderMachine(); fillRomaji();

$("lang").addEventListener("click", () => { lang = lang === "jp" ? "fr" : "jp"; save("ag-lang", lang); applyLang(); });
const muteLabel = () => { $("mute").textContent = Sound.isMuted() ? "🔇" : "🔊"; };
$("mute").addEventListener("click", () => { Sound.init(); Sound.toggleMute(); muteLabel(); });

/* ---------------- Pluie ---------------- */
(function rain() {
  if (matchMedia("(prefers-reduced-motion: reduce)").matches) return;
  const c = $("rain"), ctx = c.getContext("2d"); let drops = [];
  function resize() { c.width = innerWidth; c.height = innerHeight; drops = Array.from({ length: Math.round(innerWidth / 7) }, () => ({ x: Math.random() * c.width, y: Math.random() * c.height, l: 10 + Math.random() * 16, s: 7 + Math.random() * 7 })); }
  resize(); addEventListener("resize", resize);
  const flakes = Array.from({ length: 160 }, () => ({ x: Math.random(), y: Math.random(), r: .8 + Math.random() * 2.2, s: .4 + Math.random() * .9, p: Math.random() * 6.28 }));
  (function frame() {
    ctx.clearRect(0, 0, c.width, c.height);
    if (snowing) {
      ctx.fillStyle = inCloseup ? "rgba(255,255,255,.45)" : "rgba(255,255,255,.85)";
      for (const f of flakes) {
        f.y += f.s / c.height * 1.6; f.p += .02; if (f.y > 1.02) { f.y = -.02; f.x = Math.random(); }
        ctx.beginPath(); ctx.arc(f.x * c.width + Math.sin(f.p) * 12, f.y * c.height, f.r, 0, 6.28); ctx.fill();
      }
      requestAnimationFrame(frame); return;
    }
    ctx.strokeStyle = inCloseup ? "rgba(180,200,255,.12)" : "rgba(180,200,255,.2)"; ctx.lineWidth = 1; ctx.beginPath();
    for (const d of drops) { ctx.moveTo(d.x, d.y); ctx.lineTo(d.x - 2, d.y + d.l); d.y += d.s; d.x -= .6; if (d.y > c.height) { d.y = -d.l; d.x = Math.random() * c.width; } }
    ctx.stroke(); requestAnimationFrame(frame);
  })();
})();

/* ---------------- Mise à jour du jour ---------------- */
function refreshDay() {
  const day = Math.max(1, unlocked);
  applyTime(day);
  if (unlocked === 0) {
    $("clock-time").textContent = "--:--";
    const days = Math.max(1, Math.ceil((new Date(YEAR, 11, 1) - new Date()) / 86400000));
    $("clock-sub").textContent = `La machine s'allume le 1er décembre · encore ${days} jour${days > 1 ? "s" : ""}`;
    setLcd("sleep"); hint.textContent = "Elle dort encore. Reviens le 1er décembre.";
  } else {
    $("clock-time").textContent = timeOf(day);
    $("clock-sub").textContent = `${day} décembre · ${momentOf(day)}`;
    setLcd("welcome");
    const fresh = DAYS.some((_, i) => i < unlocked && !state.opened.includes(i + 1));
    hint.textContent = fresh ? "Une boisson t'attend. Appuie sur un bouton qui clignote." : "Tout est bu pour aujourd'hui. Reviens demain.";
  }
  renderMachine();
}

if (TEST) {
  $("testbar").hidden = false; document.body.classList.add("testing");
  const upd = () => { $("t-day").textContent = `${unlocked} déc.`; refreshDay(); };
  $("t-prev").onclick = () => { unlocked = Math.max(1, unlocked - 1); upd(); };
  $("t-next").onclick = () => { unlocked = Math.min(24, unlocked + 1); upd(); };
  $("t-reset").onclick = () => { state = { opened: [], repaired: false }; save(STORE_KEY, state); upd(); };
  $("t-day").textContent = `${unlocked} déc.`;
}
